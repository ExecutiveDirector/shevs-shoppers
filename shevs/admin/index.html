<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shevs Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F2;--card:#fff;--ink:#14201B;--mute:#586560;--line:#E0E5E0;--brand:#0F5B4A;--tint:#E6F0EB;--sale:#C93338;--warn:#B9770E;--ok:#0F5B4A;--focus:#0B57D0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2{font-family:"Bricolage Grotesque",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:24px;margin-bottom:2px}
.login p{color:var(--mute);font-size:13px;margin-bottom:8px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:13px;color:var(--mute);font-weight:500}
.fld input,.fld select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:11px 12px;font-size:15px;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--brand)}
.btn{background:var(--brand);color:#fff;font-weight:700;padding:12px;border-radius:10px;border:0;width:100%}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{color:var(--sale);font-size:13px;min-height:18px}

/* app shell */
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:10}
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.logo{font:800 20px "Bricolage Grotesque",sans-serif}
.logo b{color:#FFC53D}
.hd .sp{flex:1}
.ghost{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:9px;padding:9px 14px;font-weight:500}
.ghost:hover{background:rgba(255,255,255,.26)}

main{padding:20px 0 60px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar select,.bar input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 12px}
.bar .sp{flex:1}
.count{color:var(--mute);font-size:13px}

.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);background:var(--bg);position:sticky;top:0}
tbody tr:hover{background:var(--tint)}
tbody tr{cursor:pointer}
td.code{font-weight:700;color:var(--brand)}
.badge{display:inline-flex;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.badge.pending{background:#FFF3D6;color:#8a5a00}
.badge.confirmed{background:var(--tint);color:var(--brand)}
.badge.dispatched{background:#E6EEFB;color:#2448B0}
.badge.delivered{background:#E6F7EC;color:#167a3e}
.badge.cancelled{background:#FBE4E4;color:var(--sale)}
.empty{text-align:center;padding:48px 16px;color:var(--mute)}
.loading{text-align:center;padding:48px 16px;color:var(--mute)}
.pager{display:flex;justify-content:center;gap:10px;margin-top:16px}
.pager button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 16px}
.pager button:disabled{opacity:.5;cursor:not-allowed}

/* order detail drawer */
.scrim{position:fixed;inset:0;background:rgba(6,20,15,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--card);z-index:50;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-6px 0 30px rgba(0,0,0,.2)}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--brand);color:#fff}
.dh .x{background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;border-radius:9px;font-size:16px}
.dbody{flex:1;overflow-y:auto;padding:16px}
.drow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.drow b{font-weight:600}
.ditem{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.dsec{font-size:12px;text-transform:uppercase;color:var(--mute);font-weight:700;margin:16px 0 6px}
.statusrow{display:flex;gap:8px;align-items:center;margin-top:6px}
.statusrow select{flex:1}
.statusrow button{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:100;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){table{min-width:620px}}
</style>
</head>
<body>

<section class="login" id="loginView">
<form id="loginForm">
<h1>Shevs <b style="color:var(--brand)">Admin</b></h1>
<p>Enter your API URL and admin key to manage orders. These are stored only in this browser.</p>
<div class="fld"><label for="apiBase">API base URL</label><input id="apiBase" placeholder="https://api.shevs.co.ke" required></div>
<div class="fld"><label for="adminKey">Admin key</label><input id="adminKey" type="password" required></div>
<div class="err" id="loginErr" aria-live="polite"></div>
<button class="btn" type="submit">Connect</button>
</form>
</section>

<div id="appView" hidden>
<header><div class="wrap hd">
<span class="logo">Shevs <b>Admin</b></span>
<span class="sp"></span>
<button class="ghost" type="button" onclick="refresh()">Refresh</button>
<button class="ghost" type="button" onclick="logout()">Log out</button>
</div></header>

<main class="wrap">
<div class="bar">
<select id="statusFilter" aria-label="Filter by status">
<option value="">All statuses</option>
<option value="pending">Pending</option>
<option value="confirmed">Confirmed</option>
<option value="dispatched">Dispatched</option>
<option value="delivered">Delivered</option>
<option value="cancelled">Cancelled</option>
</select>
<span class="sp"></span>
<span class="count" id="count"></span>
</div>

<div class="tablewrap">
<table>
<thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>County</th><th>Total</th><th>Status</th><th>Placed</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<div class="pager">
<button type="button" id="prevBtn" onclick="changePage(-1)">Previous</button>
<button type="button" id="nextBtn" onclick="changePage(1)">Next</button>
</div>
</main>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
<div class="dh"><h2 id="drawerTitle" style="font-size:17px">Order</h2><button class="x" onclick="closeDrawer()" aria-label="Close">✕</button></div>
<div class="dbody" id="drawerBody"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const kes=n=>"KES "+Number(n).toLocaleString("en-KE");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let API="",KEY="",page=1,pageSize=25,lastCount=0;

function loadCreds(){API=localStorage.getItem("shevs.admin.api")||"";KEY=localStorage.getItem("shevs.admin.key")||""}
function saveCreds(api,key){localStorage.setItem("shevs.admin.api",api);localStorage.setItem("shevs.admin.key",key);API=api;KEY=key}
function clearCreds(){localStorage.removeItem("shevs.admin.api");localStorage.removeItem("shevs.admin.key");API="";KEY=""}

async function api(path,opts={}){
const r=await fetch(API.replace(/\/$/,"")+path,{...opts,headers:{"Content-Type":"application/json","x-admin-key":KEY,...(opts.headers||{})}});
const data=await r.json().catch(()=>({}));
if(!r.ok)throw new Error((data&&data.error&&data.error.message)||`Request failed (${r.status})`);
return data}

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600)}

$("loginForm").addEventListener("submit",async e=>{
e.preventDefault();
const api_=$("apiBase").value.trim(),key=$("adminKey").value.trim();
const btn=e.target.querySelector("button"),label=btn.textContent;
btn.disabled=true;btn.textContent="Connecting\u2026";$("loginErr").textContent="";
try{
API=api_;KEY=key;
await api("/api/admin/orders?pageSize=1");
saveCreds(api_,key);
showApp()
}catch(err){
$("loginErr").textContent=err.message.includes("401")||/unauthorized|invalid/i.test(err.message)?"Invalid admin key.":`Couldn't connect: ${err.message}`;
}finally{btn.disabled=false;btn.textContent=label}
});

function logout(){clearCreds();location.reload()}

function showApp(){$("loginView").hidden=true;$("appView").hidden=false;load()}

async function load(){
$("rows").innerHTML=`<tr><td colspan="7" class="loading">Loading orders\u2026</td></tr>`;
const status=$("statusFilter").value;
const qs=new URLSearchParams({page,pageSize,...(status?{status}:{})});
try{
const data=await api("/api/admin/orders?"+qs.toString());
lastCount=data.orders.length;
renderRows(data.orders);
$("count").textContent=`Page ${page} \u2022 ${data.orders.length} order${data.orders.length===1?"":"s"}`;
$("prevBtn").disabled=page<=1;
$("nextBtn").disabled=data.orders.length<pageSize;
}catch(err){
$("rows").innerHTML=`<tr><td colspan="7" class="empty">Couldn't load orders: ${esc(err.message)}</td></tr>`;
}
}

function renderRows(orders){
if(!orders.length){$("rows").innerHTML=`<tr><td colspan="7" class="empty">No orders here yet.</td></tr>`;return}
$("rows").innerHTML=orders.map(o=>`<tr onclick="openOrder('${o.order_code}')">
<td class="code">${esc(o.order_code)}</td>
<td>${esc(o.customer_name)}</td>
<td>${esc(o.phone)}</td>
<td>${esc(o.county)}</td>
<td>${kes(o.total)}</td>
<td><span class="badge ${o.status}">${esc(o.status)}</span></td>
<td>${new Date(o.created_at).toLocaleDateString("en-KE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</td>
</tr>`).join("")}

function refresh(){load()}
function changePage(d){const next=page+d;if(next<1)return;if(d>0&&lastCount<pageSize)return;page=next;load()}
$("statusFilter").addEventListener("change",()=>{page=1;load()});

const STATUSES=["pending","confirmed","dispatched","delivered","cancelled"];

async function openOrder(code){
$("drawerTitle").textContent=code;
$("drawerBody").innerHTML=`<p style="color:var(--mute)">Loading\u2026</p>`;
openDrawer();
try{
// Order detail (items, totals) is served by the public order-lookup endpoint —
// order codes aren't guessable, and no admin-only data lives there.
const data=await api(`/api/orders/${encodeURIComponent(code)}`);
$("drawerBody").innerHTML=`
<div class="dsec">Items</div>
${data.items.map(it=>`<div class="ditem"><span>${it.qty} \u00d7 ${esc(it.name_snapshot)}</span><span>${kes(it.line_total)}</span></div>`).join("")}
<div class="drow"><span>Delivery</span><b>${data.deliveryFee?kes(data.deliveryFee):"Free"}</b></div>
${data.discount?`<div class="drow"><span>Discount</span><b>-${kes(data.discount)}</b></div>`:""}
<div class="drow"><span>Total</span><b>${kes(data.total)}</b></div>
<div class="dsec">Status</div>
<div class="statusrow">
<select id="statusSelect">${STATUSES.map(s=>`<option value="${s}" ${s===data.status?"selected":""}>${s}</option>`).join("")}</select>
<button type="button" onclick="saveStatus('${code}')">Save</button>
</div>`;
}catch(err){$("drawerBody").innerHTML=`<p style="color:var(--sale)">Couldn't load this order: ${esc(err.message)}</p>`}
}

async function saveStatus(code){
const status=$("statusSelect").value;
try{
await api(`/api/admin/orders/${encodeURIComponent(code)}/status`,{method:"PATCH",body:JSON.stringify({status})});
toast(`${code} marked ${status}`);
closeDrawer();
load();
}catch(err){toast(`Couldn't update: ${err.message}`)}
}

function openDrawer(){$("drawer").classList.add("open");$("scrim").classList.add("open");$("drawer").setAttribute("aria-hidden","false")}
function closeDrawer(){$("drawer").classList.remove("open");$("scrim").classList.remove("open");$("drawer").setAttribute("aria-hidden","true")}
addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});

loadCreds();
if(API&&KEY){$("apiBase").value=API;$("adminKey").value=KEY;showApp()}
</script>
</body>
</html>

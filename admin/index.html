<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Shevs Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F2;--card:#fff;--ink:#14201B;--mute:#586560;--line:#E0E5E0;--brand:#0F5B4A;--sale:#C93338;--warn:#B9770E;--ok:#167a3e;--focus:#0B57D0;--gold:#FFC53D;--shadow:0 6px 30px rgba(0,0,0,.2);
--tint:color-mix(in srgb,var(--brand) 11%,var(--card));--link:var(--brand);--field:var(--bg);
--c-pending:#8a5a00;--c-confirmed:var(--brand);--c-dispatched:#2448B0;--c-delivered:#167a3e;--c-cancelled:#C93338;--c-low:#8a5a00;--c-hidden:#666;--c-ok:#167a3e;--c-feat:#8a5a00}
:root[data-theme=dark]{--bg:#0E1411;--card:#17201C;--ink:#E8EFEA;--mute:#9AA9A1;--line:#2A362F;--sale:#F0716F;--warn:#F5B84B;--ok:#58C57F;--focus:#7AA7FF;--shadow:0 6px 30px rgba(0,0,0,.6);
--tint:color-mix(in srgb,var(--brand) 26%,var(--card));--link:color-mix(in srgb,var(--brand) 45%,#fff);--field:#101813;
--c-pending:#F5B84B;--c-confirmed:color-mix(in srgb,var(--brand) 45%,#fff);--c-dispatched:#8FB0FF;--c-delivered:#58C57F;--c-cancelled:#F0716F;--c-low:#F5B84B;--c-hidden:#aaa;--c-ok:#58C57F;--c-feat:#F5B84B}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 "DM Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--link)}
img{max-width:100%}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:24px}
.login p{color:var(--mute);font-size:13px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lbl{font-size:13px;color:var(--mute);font-weight:500}
.fld input,.fld select,.fld textarea,.field{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:10px 12px;font-size:15px;width:100%}
.fld textarea{resize:vertical;min-height:84px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand)}
.hint{font-size:12px;color:var(--mute)}
.btn{background:var(--brand);color:#fff;font-weight:700;padding:10px 16px;border-radius:10px;border:0;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sec:hover{background:var(--tint);filter:none}
.btn.danger{background:var(--sale);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.err{color:var(--sale);font-size:13px;min-height:18px}

/* app shell */
.app{display:grid;grid-template-columns:var(--sw,240px) 1fr;min-height:100vh;transition:grid-template-columns .2s}
.side{background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto}
.brandrow{display:flex;align-items:center;gap:10px;padding:2px 4px 14px}
.mark{flex:none;width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 19px "Bricolage Grotesque",sans-serif}
.logo{font:800 19px/1.1 "Bricolage Grotesque",sans-serif;flex:1;min-width:0;word-break:break-word}
.cbtn{width:30px;height:30px;border-radius:8px;font-size:15px;color:var(--mute)}
.logo b{color:var(--link)}
.nsec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:14px 10px 5px}
.nlink{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 10px;border-radius:10px;color:var(--ink);text-align:left;font-weight:500}
.nlink:hover{background:var(--tint)}
.nlink.on{background:var(--brand);color:#fff;font-weight:700}
.nlink .ic{width:22px;text-align:center}
.dot.warn{background:var(--warn)}
.dot{background:var(--sale);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center;margin-left:auto}
.sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.mainwrap{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.icon{background:var(--bg);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:16px;display:inline-grid;place-items:center}
.icon:hover{background:var(--tint)}
#burger{display:none}
.sp{flex:1}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px 9px 36px;font-size:14px}
.gsearch:before{content:"🔎";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.7}
.gsres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:70vh;overflow-y:auto;z-index:30;padding:6px}
.gsres h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:8px 10px 4px}
.gsres button{display:flex;width:100%;justify-content:space-between;gap:10px;background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px}
.gsres button:hover,.gsres button:focus{background:var(--tint)}
.gsres small{color:var(--mute)}
main{max-width:1240px;margin:0 auto;padding:22px 20px 90px}
.pagehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h2{font-size:24px}
.sub{color:var(--mute)}
.crumb{color:var(--mute);font-size:13px;white-space:nowrap}
.crumb b{color:var(--ink);font-weight:700}
.gsearch kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:600 11px "DM Sans",sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--card);pointer-events:none}
.gsearch input:focus+kbd{display:none}
.gsres .sel{background:var(--tint)}
.gsres a{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
.gsres a:hover{background:var(--tint)}
.gsres button span.ci,.gsres a span.ci{display:inline-block;width:24px}
.gsres small.k{font:600 11px "DM Sans",sans-serif;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--mute)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:99px;background:var(--ok)}
.sync.off i{background:var(--warn)}
.bell{position:relative}
.bell .dot{position:absolute;top:-6px;right:-6px;margin:0;font-size:10px;padding:0 5px;min-width:17px}
.qa{position:relative}
.qamenu{left:auto;right:0;width:210px;top:calc(100% + 6px)}
.tabs{display:none}
.sidefoot a.nlink{text-decoration:none}
@media(min-width:901px){
 body.collapsed{--sw:72px}
 body.collapsed .side{padding:16px 8px}
 body.collapsed .nl,body.collapsed .logo{display:none}
 body.collapsed .brandrow{flex-direction:column;gap:8px;padding:2px 0 10px}
 body.collapsed .nsec{font-size:0;padding:0;margin:10px 8px 6px;border-top:1px solid var(--line)}
 body.collapsed .nlink{justify-content:center;position:relative;padding:11px 0}
 body.collapsed .nlink .ic{width:auto;font-size:18px}
 body.collapsed .nlink .dot{position:absolute;top:1px;right:7px;margin:0;font-size:10px;padding:0 5px;min-width:16px}
}
@media(max-width:900px){
 .crumb,.sync,.sp,.cbtn{display:none}
 .side.open~.mainwrap::after{content:"";position:fixed;inset:0;background:rgba(7,20,15,.45);z-index:50}
 .gsearch{max-width:none}
 .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
 .tabs button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;font-size:11.5px;font-weight:500;color:var(--mute);min-height:54px}
 .tabs button .ic{font-size:19px;line-height:1.2}
 .tabs button.on{color:var(--link);font-weight:700}
 .tabs button.on:before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
 .tabs .dot{position:absolute;top:3px;left:calc(50% + 6px);margin:0;font-size:10px;padding:0 5px;min-width:16px}
 .toast{bottom:76px}
 .gsearch kbd{display:none}
 .qamenu{right:-40px}
}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;z-index:60;width:260px;transform:translateX(-102%);transition:transform .22s;box-shadow:var(--shadow)}
 .side.open{transform:none}
 #burger{display:inline-grid}
 .top{padding:10px 12px}
 main{padding:16px 12px 100px}
}

/* cards & kpis */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
body[data-density=compact] .card{padding:12px}
.card h3{font-size:15px;margin-bottom:10px}
.kpi .lbl{text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-size:12px}
.kpi .val{font:800 25px "Bricolage Grotesque",sans-serif;margin:4px 0 2px}
.kpi .sub{font-size:13px}
.kpi.alert{border-color:#F0C36D;background:color-mix(in srgb,#F59E0B 12%,var(--card))}
.kpi.alert .val{color:var(--warn)}
.hello{font:800 26px "Bricolage Grotesque",sans-serif}
.two{grid-template-columns:2fr 1fr}
.three{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.list .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.list .row:last-child{border:0}
.list small{color:var(--mute);display:block;font-size:12px}
.muted{color:var(--mute)}
.chart{width:100%;height:auto;display:block}
.chart text{font:11px "DM Sans",sans-serif;fill:var(--mute)}
.chart .bar{fill:var(--brand)}
.chart .bar:hover{opacity:.8}
.chart .today{fill:var(--gold)}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.rvt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:4px}.rvc{margin-bottom:12px}
.bars .brow{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bars .track{background:var(--bg);border-radius:99px;height:10px;overflow:hidden}
.bars .fill{height:100%;background:var(--brand);border-radius:99px}
.check{display:flex;gap:10px;align-items:center;padding:7px 0}
.check .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.check.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.check.done span{color:var(--mute);text-decoration:line-through}
.imp{margin-bottom:14px}.imp p{margin:6px 0 10px}.impbtn{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.impbtn label.btn{cursor:pointer}
.impd{margin-top:12px}.impd summary{cursor:pointer;color:var(--link);font-size:14px}.impd textarea{width:100%;margin:8px 0;font:13px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:inherit}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{margin-top:3px}
.imptbl td.wrap{white-space:normal;min-width:220px;font-size:13px}.imptbl tr.bad td{background:color-mix(in srgb,var(--sale) 7%,transparent)}.imptbl .e{color:var(--sale);font-weight:500}
.impth{width:36px;height:36px;object-fit:cover;border-radius:8px;display:block}.tag.ok{background:color-mix(in srgb,var(--ok,#1a7f4b) 14%,transparent);color:var(--ok,#1a7f4b)}.tag.bad{background:var(--sale);color:#fff}.tag.mute{opacity:.6}
.impgo{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}.impfail{margin:8px 0 12px 18px;font-size:13px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.gt{display:flex;flex-direction:column;gap:6px}.gimg{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}.gimg img{width:100%;height:100%;object-fit:cover;display:block}.gimg em{position:absolute;left:6px;top:6px;background:var(--brand);color:#fff;font-style:normal;font-size:11px;padding:2px 8px;border-radius:99px}
.gt.main .gimg{border-color:var(--brand);border-width:2px}.gc{width:100%;font-size:13px;padding:6px 8px}.gb{display:flex;gap:4px}.gb button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 0;cursor:pointer;color:inherit}.gb button:disabled{opacity:.35;cursor:default}
.vzt{min-width:640px}.vzt input[type=number],.vzt input:not([type]){width:100%;min-width:70px;padding:7px 8px}.vzt td{padding:6px 8px}
.progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:6px 0 10px}
.progress i{display:block;height:100%;background:var(--brand)}

/* tables */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar input,.bar select{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px;min-width:0}
.bar input[type=search]{flex:1;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:13px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip small{opacity:.75;margin-left:4px}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
body[data-density=compact] th,body[data-density=compact] td{padding:6px 12px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover,tr.sel{background:var(--tint)}
td.code{font-weight:700;color:var(--link)}
td.r,th.r{text-align:right}
td.w{white-space:normal;min-width:240px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;--c:var(--mute);color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.badge.pending{--c:var(--c-pending)}.badge.confirmed{--c:var(--c-confirmed)}.badge.dispatched{--c:var(--c-dispatched)}.badge.delivered{--c:var(--c-delivered)}
.badge.cancelled,.badge.out{--c:var(--c-cancelled)}.badge.low{--c:var(--c-low)}.badge.hidden{--c:var(--c-hidden)}.badge.ok{--c:var(--c-ok)}.badge.feat{--c:var(--c-feat)}
.empty,.loading{text-align:center;padding:44px 16px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px;color:var(--mute)}
.pname{display:flex;align-items:center;gap:10px}
.thumb{width:44px;height:44px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.upl{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.upl .thumb{width:96px;height:96px;font-size:40px;border-radius:14px}
.uplb{display:flex;flex-direction:column;gap:6px;min-width:0}.uplbtns{display:flex;gap:8px;flex-wrap:wrap}
label.btn{cursor:pointer;display:inline-flex;align-items:center}.upl.busy{opacity:.6;pointer-events:none}

.stock{display:inline-flex;align-items:center;gap:4px}
.stock button{border:1px solid var(--line);background:var(--card);border-radius:7px;width:26px;height:26px;line-height:1;font-weight:700}
.stock button:hover{background:var(--tint)}
.stock input{width:56px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:4px;background:var(--card)}
.switch{position:relative;width:38px;height:22px;display:inline-block;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#9aa7a0;border-radius:99px;transition:.15s}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span:before{transform:translateX(16px)}
.switch input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.summary .card{padding:10px 14px;flex:1;min-width:140px}
.summary b{display:block;font:800 19px "Bricolage Grotesque",sans-serif}
.bulk{position:sticky;bottom:12px;z-index:12;background:var(--ink);color:var(--card);border-radius:14px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;box-shadow:var(--shadow)}
.bulk .btn{background:rgba(255,255,255,.14);color:inherit;border:0;font-weight:500}
.bulk .btn.danger{background:var(--sale);color:#fff}
.bulk select{background:rgba(255,255,255,.14);color:inherit;border:0;border-radius:8px;padding:6px 8px}
.bulk select option{color:#000}

/* drawers + modal */
.scrim{position:fixed;inset:0;background:rgba(6,20,15,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--card);z-index:50;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.wide{width:min(760px,100vw);z-index:55;background:var(--bg)}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--brand);color:#fff}
.dh h2{font-size:17px}
.dh .x{background:rgba(255,255,255,.18);border:0;color:#fff;width:34px;height:34px;border-radius:9px;font-size:16px}
.dbody{flex:1;overflow-y:auto;padding:16px}
.dfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:var(--card);border-top:1px solid var(--line)}
.dsec{font-size:12px;text-transform:uppercase;color:var(--mute);font-weight:700;margin:18px 0 6px;letter-spacing:.04em}
.dsec:first-child{margin-top:0}
.drow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.drow span:first-child{color:var(--mute)}
.drow b{font-weight:600;text-align:right}
.ditem{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;font-weight:500;text-transform:capitalize}
.step.cur{background:var(--brand);color:#fff;border-color:var(--brand);cursor:default}
.step.cancel{color:var(--sale)}
.step.cancel.cur{background:var(--sale);color:#fff;border-color:var(--sale)}
.sect{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:13px}
.sect>h3{font-size:15px;display:flex;align-items:center;gap:8px}
.sect>h3 small{font:400 12px "DM Sans",sans-serif;color:var(--mute)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:560px){.frow,.frow3{grid-template-columns:1fr}}
.inline{display:flex;gap:8px;align-items:center}
.inline .field,.inline input{flex:1}
.tog{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:6px 0}
.tog small{display:block;color:var(--mute)}
.pv{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px}
.pv .thumb{width:72px;height:72px;font-size:34px}
.pv .nm{font-weight:700}
.pv .pr{font:800 18px "Bricolage Grotesque",sans-serif}
.pv s{color:var(--mute);font-weight:400;font-size:13px}
.pv .off{background:var(--sale);color:#fff;border-radius:6px;font-size:11px;padding:1px 6px;margin-left:6px;font-weight:700}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.calc div{background:var(--bg);border-radius:10px;padding:8px 10px}
.calc b{display:block;font-size:16px}
.calc span{font-size:12px;color:var(--mute)}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--tint);color:var(--link);border-radius:99px;padding:2px 10px;font-size:12px}
.stockbig{font:800 34px "Bricolage Grotesque",sans-serif;line-height:1}
.hist{width:100%;min-width:0;font-size:13px}
.hist td,.hist th{padding:6px 8px;white-space:normal}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--sale);font-weight:700}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(6,20,15,.55)}
.modal form,.modal .box{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:13px}
.modal h3{font-size:19px}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:100;font-size:14px;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card);border:0;padding:8px 14px;border-right:1px solid var(--line)}
.seg button:last-child{border:0}
.seg button.on{background:var(--brand);color:#fff;font-weight:700}
@media print{.side,.top,.pager,.bar,.chips,.actions,.scrim,.dfoot{display:none!important}.app{display:block}}
</style>

<body data-density="comfortable">

<section class="login" id="loginView">
<form id="loginForm">
<h1>Shevs <b style="color:var(--brand)">Admin</b></h1>
<p>Enter your API URL and admin key to manage your shop. They're stored only in this browser.</p>
<div class="fld"><label for="apiBase">API base URL</label><input id="apiBase" placeholder="https://shevs-api-production.up.railway.app" required></div>
<div class="fld"><label for="adminKey">Admin key</label><input id="adminKey" type="password" autocomplete="current-password" required></div>
<div class="err" id="loginErr" aria-live="polite"></div>
<button class="btn block" type="submit">Connect</button>
</form>
</section>

<div class="app" id="appView" hidden>
 <aside class="side" id="side">
  <div class="brandrow"><span class="mark" id="brandMark" aria-hidden="true">S</span><span class="logo" id="brandName">Shevs <b>Admin</b></span><button class="icon cbtn" id="cbtn" data-act="collapse" title="Collapse sidebar  ( [ )" aria-label="Collapse sidebar">«</button></div>
  <nav id="nav" aria-label="Main"></nav>
  <div class="sidefoot">
   <a class="nlink" href="../" target="_blank" rel="noopener" title="Open the shop"><span class="ic">🛍️</span><span class="nl">View shop ↗</span></a>
   <button class="nlink" data-act="toggleTheme" title="Dark / light"><span class="ic">🌓</span><span class="nl">Dark / light</span></button>
   <button class="nlink" data-act="logout" title="Log out"><span class="ic">🚪</span><span class="nl">Log out</span></button>
  </div>
 </aside>
 <div class="mainwrap">
  <header class="top">
   <button class="icon" id="burger" data-act="menu" aria-label="Open menu">☰</button>
   <div class="crumb" id="crumb"></div>
   <div class="gsearch"><input id="gs" type="search" placeholder="Search or jump to…" aria-label="Search or jump to" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="gsRes"><kbd id="gsk">Ctrl K</kbd><div class="gsres" id="gsRes" hidden></div></div>
   <span class="sp"></span>
   <span class="sync" id="sync" title="Connecting…"><i></i><span class="t">Live</span></span>
   <button class="icon bell" data-act="goOrders" data-status="pending" title="Pending orders" aria-label="Pending orders">🔔<span class="dot" id="bellN" hidden></span></button>
   <div class="qa"><button class="btn sm" data-act="qaToggle" aria-haspopup="true">＋ New</button><div class="gsres qamenu" id="qaMenu" hidden><button data-act="newProduct"><span><span class="ci">📦</span>Product</span></button><button data-act="newCategory"><span><span class="ci">🗂️</span>Category</span></button><button data-act="newCoupon"><span><span class="ci">🏷️</span>Coupon</span></button></div></div>
   <button class="icon" data-act="refresh" title="Refresh" aria-label="Refresh">⟳</button>
  </header>
  <main id="content"></main>
 </div>
</div>

<nav class="tabs" id="tabs" aria-label="Quick navigation"></nav>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
 <div class="dh"><h2 id="drawerTitle">Order</h2><button class="x" data-act="closeDrawer" aria-label="Close">✕</button></div>
 <div class="dbody" id="drawerBody"></div>
</aside>
<aside class="drawer wide" id="editor" aria-hidden="true">
 <div class="dh"><h2 id="edTitle">Product</h2><button class="x" data-act="closeEditor" aria-label="Close">✕</button></div>
 <form class="dbody" id="edForm" novalidate></form>
 <div class="dfoot" id="edFoot"></div>
</aside>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kes=n=>"KES "+Math.round(Number(n)||0).toLocaleString("en-KE");
const num=n=>(Number(n)||0).toLocaleString("en-KE");
const TZ="Africa/Nairobi";
const fdate=d=>new Date(d).toLocaleString("en-KE",{timeZone:TZ,day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const fdateLong=d=>new Date(d).toLocaleString("en-KE",{timeZone:TZ,day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
const fday=d=>new Date(d).toLocaleDateString("en-KE",{timeZone:TZ,day:"numeric",month:"short",year:"numeric"});
const waNumber=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="254"+d.slice(1);return d};
const STATUSES=["pending","confirmed","dispatched","delivered","cancelled"];
const DEFAULT_API="https://shevs-api-production.up.railway.app";
const VIEWS=["dashboard","orders","customers","coupons","products","categories","settings","reports","reviews","waitlist","promotions","import","photos","delivery"];
const NAV=[
 ["Overview",[["dashboard","🏠","Dashboard","d"]]],
 ["Sales",[["orders","🧾","Orders","o"],["customers","👥","Customers","u"],["coupons","🏷️","Coupons","c"],["reports","📈","Reports","r"]]],
 ["Catalogue",[["products","📦","Products","p"],["categories","🗂️","Categories","a"],["promotions","🎁","Promotions","m"],["reviews","⭐","Reviews","v"],["waitlist","🔔","Waiting list","w"]]],
 ["Store",[["delivery","🚚","Delivery","y"],["settings","⚙️","Settings","s"]]]];
const TABS=[["dashboard","🏠","Home"],["orders","🧾","Orders"],["products","📦","Products"],["customers","👥","Customers"]];
const ACCENTS={green:["#0F5B4A","Forest"],blue:["#1D4ED8","Ocean"],purple:["#6D28D9","Plum"],orange:["#C2410C","Sunset"],rose:["#BE123C","Rose"],slate:["#334155","Slate"]};
const REASONS={restock:"Restock",correction:"Stock count",damaged:"Damaged / lost",return:"Customer return",other:"Other",sale:"Sale",cancel:"Order cancelled",reopen:"Order re-opened"};

let API="",KEY="",view="dashboard",cats=[],knownPending=null,pollT=null;
let S={shop_name:"Shevs",whatsapp_number:"",delivery_fee:250,free_delivery_threshold:3000,low_stock_threshold:5};
const st={
 orders:{page:1,size:25,status:"",q:"",from:"",to:"",total:0,rows:[]},
 products:{page:1,size:25,q:"",category:"",state:"",sort:"updated",total:0,rows:[],sel:new Set()},
 customers:{page:1,size:25,q:"",total:0,rows:[]}
};

/* ---------- personal preferences (saved in this browser) ---------- */
let prefs={theme:"auto",accent:"green",density:"comfortable",home:"dashboard",collapsed:false};
try{Object.assign(prefs,JSON.parse(localStorage.getItem("shevs.admin.prefs")||"{}"))}catch(e){}
if(!ACCENTS[prefs.accent])prefs.accent="green";
function applyPrefs(){
 const dark=prefs.theme==="dark"||(prefs.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
 document.documentElement.dataset.theme=dark?"dark":"light";
 document.documentElement.style.setProperty("--brand",ACCENTS[prefs.accent][0]);
 document.body.dataset.density=prefs.density;
 document.body.classList.toggle("collapsed",!!prefs.collapsed);
 const cb=document.getElementById("cbtn");if(cb){cb.textContent=prefs.collapsed?"»":"«";cb.title=(prefs.collapsed?"Expand":"Collapse")+" sidebar  ( [ )";cb.setAttribute("aria-label",cb.title)}}
function savePrefs(){try{localStorage.setItem("shevs.admin.prefs",JSON.stringify(prefs))}catch(e){}applyPrefs()}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyPrefs);
applyPrefs();

/* ---------- api ---------- */
async function api(path,opts={}){
 let r;
 try{r=await fetch(API.replace(/\/$/,"")+"/api/admin"+path,{...opts,headers:{"Content-Type":"application/json","x-admin-key":KEY,...(opts.headers||{})}})}
 catch(e){throw new Error("Can't reach the server. Check your connection.")}
 const data=await r.json().catch(()=>({}));
 if(r.status===401){const e=new Error("Invalid admin key.");e.auth=true;throw e}
 if(!r.ok){
  const er=(data&&data.error)||{};
  const det=Array.isArray(er.details)?er.details.map(x=>x.message).filter(Boolean).join(" "):"";
  const e=new Error(det||er.message||`Request failed (${r.status})`);e.status=r.status;throw e}
 return data}
const send=(method,body)=>({method,body:JSON.stringify(body||{})});
const qs=o=>{const p=new URLSearchParams();Object.entries(o).forEach(([k,v])=>{if(v!==""&&v!=null)p.set(k,v)});const s=p.toString();return s?"?"+s:""};
function handleErr(e){if(e&&e.auth){logout("Your session expired. Enter the admin key again.");return}toast(e.message)}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),3400)}
const debounce=(fn,ms=350)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";

/* ---------- auth ---------- */
function loadCreds(){try{API=localStorage.getItem("shevs.admin.api")||"";KEY=localStorage.getItem("shevs.admin.key")||""}catch(e){}}
function logout(msg){
 try{localStorage.removeItem("shevs.admin.api");localStorage.removeItem("shevs.admin.key")}catch(e){}
 clearInterval(pollT);API="";KEY="";
 $("appView").hidden=true;$("loginView").hidden=false;$("adminKey").value="";
 $("apiBase").value=DEFAULT_API;$("loginErr").textContent=typeof msg==="string"?msg:"";closeAll();document.title="Shevs Admin"}
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const a=$("apiBase").value.trim(),k=$("adminKey").value.trim();
 const btn=e.target.querySelector("button"),label=btn.textContent;
 btn.disabled=true;btn.textContent="Connecting…";$("loginErr").textContent="";
 try{API=a;KEY=k;await api("/stats");
  try{localStorage.setItem("shevs.admin.api",a);localStorage.setItem("shevs.admin.key",k)}catch(e){}
  start()}
 catch(err){$("loginErr").textContent=err.auth?"Invalid admin key.":"Couldn't connect: "+err.message}
 finally{btn.disabled=false;btn.textContent=label}});

async function start(){
 $("loginView").hidden=true;$("appView").hidden=false;
 buildNav();
 try{S={...S,...(await api("/settings")).settings}}catch(e){if(e.auth)return handleErr(e)}
 brand();
 const h=location.hash.slice(1);
 go(VIEWS.includes(h)?h:(VIEWS.includes(prefs.home)?prefs.home:"dashboard"));
 clearInterval(pollT);pollT=setInterval(poll,45000);poll()}
function brand(){$("brandName").innerHTML=esc(S.shop_name)+" <b>Admin</b>";$("brandMark").textContent=(S.shop_name||"S").trim().charAt(0).toUpperCase()||"S";document.title=($("pendDot")&&!$("pendDot").hidden?`(${$("pendDot").textContent}) `:"")+S.shop_name+" Admin"}

/* ---------- navigation ---------- */
function buildNav(){
 $("nav").innerHTML=NAV.map(([sec,items])=>`<div class="nsec">${sec}</div>`+items.map(([v,ic,l,k])=>`<button class="nlink" data-view="${v}" title="${l}  ( g then ${k} )"><span class="ic">${ic}</span><span class="nl">${l}</span>${v==="orders"?`<span class="dot" id="pendDot" hidden></span>`:v==="reviews"?`<span class="dot" id="revDot" hidden title="Waiting for approval"></span>`:v==="waitlist"?`<span class="dot warn" id="waitDot" hidden title="Waiting to be told"></span>`:v==="products"?`<span class="dot warn" id="lowDot" hidden title="Low or out of stock"></span>`:""}</button>`).join("")).join("");
 $("tabs").innerHTML=TABS.map(([v,ic,l])=>`<button data-act="goView" data-view="${v}"><span class="ic">${ic}</span>${l}${v==="orders"?`<span class="dot" id="pendTab" hidden></span>`:v==="products"?`<span class="dot warn" id="lowTab" hidden></span>`:""}</button>`).join("")+`<button data-act="menu"><span class="ic">☰</span>More</button>`}
$("nav").addEventListener("click",e=>{const b=e.target.closest(".nlink");if(b){go(b.dataset.view);$("side").classList.remove("open")}});
function setBadges(pend,low){
 [["pendDot",pend],["pendTab",pend],["bellN",pend],["lowDot",low],["lowTab",low]].forEach(([id,n])=>{const el=$(id);if(el){el.hidden=!n;el.textContent=n>99?"99+":n}})}
function setSync(ok){const el=$("sync");el.classList.toggle("off",!ok);el.querySelector(".t").textContent=ok?"Live":"Offline";el.title=ok?"Updated "+new Date().toLocaleTimeString("en-KE",{hour:"2-digit",minute:"2-digit"}):"Can't reach the server. Retrying…"}
function go(v){
 closeAll();view=v;history.replaceState(null,"","#"+v);
 document.querySelectorAll(".nlink[data-view]").forEach(t=>{const on=t.dataset.view===v;t.classList.toggle("on",on);t.setAttribute("aria-current",on?"page":"false")});
 document.querySelectorAll("#tabs [data-view]").forEach(t=>t.classList.toggle("on",t.dataset.view===v));
 const sec=NAV.find(([,it])=>it.some(x=>x[0]===v));const item=sec&&sec[1].find(x=>x[0]===v);
 if(v==="import"){$("crumb").innerHTML="Catalogue › <b>Import products</b>";document.querySelectorAll(".nlink[data-view=products]").forEach(t=>t.classList.add("on"))}else if(v==="photos"){$("crumb").innerHTML="Catalogue › <b>Match photos</b>";document.querySelectorAll(".nlink[data-view=products]").forEach(t=>t.classList.add("on"))}else $("crumb").innerHTML=item?`${esc(sec[0])} › <b>${item[2]}</b>`:"";
 window.scrollTo(0,0);
 ({dashboard:vDashboard,orders:vOrders,products:vProducts,categories:vCategories,coupons:vCoupons,customers:vCustomers,settings:vSettings,reports:vReports,reviews:vReviews,waitlist:vWaitlist,promotions:vPromotions,import:vImport,photos:vPhotos,delivery:vDelivery})[v]()}
async function poll(){
 try{
  const d=await api("/stats");
  const n=(d.statusCounts&&d.statusCounts.pending)||0,low=d.lowStockCount||0;
  setBadges(n,low);setSync(true);
  api("/badges").then(b=>{[["revDot",b.reviews],["waitDot",b.alerts]].forEach(([id,k])=>{const el=$(id);if(el){el.hidden=!k;el.textContent=k>99?"99+":k}})}).catch(()=>{});
  document.title=(n?`(${n}) `:"")+S.shop_name+" Admin";
  if(knownPending!=null&&n>knownPending){toast(`🛒 ${n-knownPending} new order${n-knownPending>1?"s":""} received`);
   if(view==="orders"&&!$("drawer").classList.contains("open"))loadOrders();if(view==="dashboard")vDashboard()}
  knownPending=n}catch(e){if(e.auth)handleErr(e);else setSync(false)}}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const p=e.target.closest("[data-pg]");
 if(p){const[fn,d]=p.dataset.pg.split(":");({orders:()=>{st.orders.page+=+d;loadOrders()},products:()=>{st.products.page+=+d;loadProducts()},customers:()=>{st.customers.page+=+d;loadCustomers()}})[fn]();return}
 const a=e.target.closest("[data-act]");
 if(a){if(a.tagName==="A"&&(a.getAttribute("href")||"").startsWith("#"))e.preventDefault();act(a.dataset.act,a)}
 if(!e.target.closest(".gsearch"))$("gsRes").hidden=true;
 if(!e.target.closest(".qa"))$("qaMenu").hidden=true;
 if($("side").classList.contains("open")&&!e.target.closest(".side,#burger,[data-act=menu]"))$("side").classList.remove("open")});
document.addEventListener("error",e=>{const t=e.target;if(t&&t.tagName==="IMG"&&t.dataset.fb!==undefined){t.replaceWith(document.createTextNode(t.dataset.fb||"📦"))}},true);
function act(name,el){
 const d=el.dataset;
 const m={
  refresh:()=>{go(view);poll()},logout:()=>logout(),menu:()=>$("side").classList.toggle("open"),
  toggleTheme:()=>{prefs.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";savePrefs()},
  closeDrawer,closeEditor:()=>tryCloseEditor(),closeModal,
  openOrder:()=>openOrder(d.code),setStatus:()=>setStatus(d.code,d.status),exportOrders:()=>exportOrders(el),
  copyOrder,printOrder:()=>window.print(),saveNote:()=>saveNote(d.code),
  newProduct:()=>productEditor(),matchPhotos:()=>{PH.rows=[];go("photos")},stockAll:()=>stockAllForm(),importProducts:()=>{IMP.table=null;IMP.done=null;IMP.existing=null;go("import")},editProduct:()=>productEditor(+d.id),exportProducts:()=>exportProducts(el),
  stockStep:()=>stockStep(+d.id,+d.d,el),
  newZone:()=>zoneForm(),saveZone:()=>saveZone(+d.id),addAreas:()=>areasForm(+d.id,d.name),delZone:()=>delZone(+d.id,d.name),delArea:()=>delArea(+d.id,d.name),setFee:()=>setFee(d.code),
  newCategory:()=>categoryForm(),editCategory:()=>categoryForm(+d.id),delCategory:()=>delCategory(+d.id,d.name),
  resetAcct:()=>resetAcct(+d.id,d.name),newPromo:()=>promoForm(),editPromo:()=>promoForm(+d.id),delPromo:()=>delPromo(+d.id,d.name),newBanner:()=>bannerForm(),editBanner:()=>bannerForm(+d.id),delBanner:()=>delBanner(+d.id,d.name),
  revSet:()=>revSet(+d.id,d.status),revDel:()=>revDel(+d.id),alertDone:()=>alertDone(+d.id),alertDel:()=>alertDel(+d.id),repRange:()=>repRange(d.r),repExport:()=>repExport(el),
  newCoupon:()=>couponForm(),editCoupon:()=>couponForm(+d.id),delCoupon:()=>delCoupon(+d.id,d.code),
  goOrders:()=>{st.orders.status=d.status||"";st.orders.page=1;go("orders")},
  goProducts:()=>{st.products.state=d.state||"";st.products.page=1;go("products")},
  goView:()=>{go(d.view);$("side").classList.remove("open")},collapse:()=>{prefs.collapsed=!prefs.collapsed;savePrefs()},qaToggle:()=>{const m=$("qaMenu");m.hidden=!m.hidden},bulk:()=>bulkAct(d.do),clearSel:()=>{st.products.sel.clear();loadProducts()}};
 if(name!=="qaToggle")$("qaMenu").hidden=true;
 if(m[name])m[name]()}
function closeAll(){$("qaMenu").hidden=true;closeDrawer();closeEditor();closeModal();$("side").classList.remove("open");$("gsRes").hidden=true}
addEventListener("keydown",e=>{
 if(e.key==="Escape"){if($("modalRoot").firstChild)closeModal();else if($("editor").classList.contains("open"))tryCloseEditor();else{closeDrawer();$("gsRes").hidden=true;$("side").classList.remove("open")}}
 const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName)||(document.activeElement||{}).isContentEditable;
 if($("appView").hidden)return;
 if((e.key==="k"||e.key==="K")&&(e.ctrlKey||e.metaKey)){e.preventDefault();$("gs").focus();$("gs").select();return}
 if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==="/"){e.preventDefault();$("gs").focus();return}
 if(e.key==="["){act("collapse",{dataset:{}});return}
 if(goKey){clearTimeout(goKey);goKey=0;const hit=NAV.flatMap(x=>x[1]).find(x=>x[3]===e.key.toLowerCase());if(hit){e.preventDefault();go(hit[0])}return}
 if(e.key==="g"){goKey=setTimeout(()=>goKey=0,900)}});
let goKey=0;
function gsHint(){$("gs").placeholder=matchMedia("(max-width:900px)").matches?"Search…":"Search or jump to…"}
gsHint();addEventListener("resize",gsHint);
$("scrim").addEventListener("click",()=>{if($("editor").classList.contains("open"))tryCloseEditor();else closeDrawer()});

/* ---------- shared pieces ---------- */
const badge=(s,label)=>`<span class="badge ${esc(s)}">${esc(label||s)}</span>`;
function pager(s,fn){
 const pages=Math.max(1,Math.ceil(s.total/s.size));
 return `<div class="pager"><button class="btn sec sm" data-pg="${fn}:-1" ${s.page<=1?"disabled":""}>Previous</button><span>Page ${s.page} of ${pages} · ${num(s.total)} total</span><button class="btn sec sm" data-pg="${fn}:1" ${s.page>=pages?"disabled":""}>Next</button></div>`}

function cmdHtml(q){
 const w=q.toLowerCase().split(/\s+/).filter(Boolean);
 let list=CMDS.filter(c=>w.every(x=>(c.l+" "+c.g).toLowerCase().includes(x)));
 if(w.length)list=list.slice(0,4);
 let g="",h="";
 list.forEach(c=>{
  if(c.g!==g){g=c.g;h+=`<h4>${g}</h4>`}
  const k=c.hint?`<small class="k">${esc(c.hint)}</small>`:"";
  const inner=`<span><span class="ci">${c.ic}</span>${esc(c.l)}</span>${k}`;
  h+=c.href?`<a href="${c.href}" target="_blank" rel="noopener">${inner}</a>`:`<button data-act="${c.act}"${Object.entries(c.data||{}).map(([a,b])=>` data-${a}="${esc(b)}"`).join("")}>${inner}</button>`});
 return h}

 else if(e.key==="Enter"){const items=[...$("gsRes").querySelectorAll("button,a")];const t=items.find(x=>x.classList.contains("sel"))||items[0];if(t){e.preventDefault();t.click();$("gs").blur()}}});

  +(c.customers.length?`<h4>Customers</h4>`+c.customers.map(x=>`<button data-act="gsCustomer" data-q="${esc(x.phone)}"><span>${esc(x.name)}</span><small>${esc(x.phone)} · ${x.orders} order${x.orders>1?"s":""}</small></button>`).join(""):"");
  showPalette(local+remote||`<p class="muted" style="padding:12px">No matches for “${esc(q)}”.</p>`)}catch(e){handleErr(e)}}));

const csvCell=v=>{v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return `"${v.replace(/"/g,'""')}"`};
function downloadCsv(name,head,rows){
 const csv="﻿"+[head,...rows].map(r=>r.map(csvCell).join(",")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
 a.download=`${name}-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function fetchAll(path,key,params,size){
 let rows=[],page=1,total=Infinity;
 while(rows.length<total&&page<=100){const d=await api(path+qs({...params,page,pageSize:size}));total=d.total;rows=rows.concat(d[key]);if(!d[key].length)break;page++}
 return rows}

/* ---------- bulk import: spreadsheet (CSV) + photos ---------- */
const IMP={defStock:5,table:null,photos:new Map(),files:[],mode:"update",mkCats:true,busy:false,stop:false,rows:[],existing:null,done:null};
const impKey=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"");
const IMP_COLS={id:["id"],name:["name","product","productname","title","item"],category:["category","categoryname","type"],price:["price","sellingprice","saleprice"],compareAtPrice:["wasprice","was","compareatprice","compareat","oldprice"],costPrice:["costprice","cost","buyingprice"],stock:["stock","qty","quantity","openingstock"],sku:["sku","code","productcode"],brand:["brand"],description:["description","desc","details"],tags:["tags","keywords"],image:["image","imagelink","imageurl","photo","photos","picture","pictures","images","imagefile","photofile","imagename","photoname"],active:["visible","active","show","published"],featured:["featured"],etaLabel:["deliveryestimate","eta","delivery","deliverytime"],lowStockThreshold:["lowstockalert","lowstock","lowstockthreshold"],sizes:["sizes","sizesandprices","variants","sizeoptions"],colors:["colours","colors","colour","color"]};
function parseCSV(t){
 t=String(t).replace(/^﻿/,"");const first=t.split(/\r?\n/)[0]||"";
 const cnt=ch=>(first.split(ch).length-1);const d=[["\t",cnt("\t")],[";",cnt(";")],[",",cnt(",")]].sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],cur="",q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"'&&cur==="")q=true;
  else if(c===d){row.push(cur);cur=""}
  else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>x.trim()!==""))rows.push(row);row=[]}
  else cur+=c}
 row.push(cur);if(row.some(x=>x.trim()!==""))rows.push(row);return rows}
const impMoney=s=>{const x=String(s==null?"":s).replace(/kes|ksh\.?|[,\s]/gi,"");return x===""?null:Number(x)};
const impBool=s=>{const x=String(s==null?"":s).trim().toLowerCase();if(!x)return undefined;if(["yes","y","true","1","visible","show","on"].includes(x))return true;if(["no","n","false","0","hidden","hide","off"].includes(x))return false;return null};
const impCatKey=s=>String(s||"").toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim();
const impStem=f=>String(f).replace(/\.[a-z0-9]{2,5}$/i,"");
function impPhoto(v){const k=String(v||"").trim().toLowerCase();if(!k)return null;return IMP.photos.get(k)||IMP.photos.get(impStem(k))||null}
function impBuild(){
 const T=IMP.table;IMP.rows=[];if(!T||T.length<2)return;
 const head=T[0].map(impKey),col={};
 for(const[f,names]of Object.entries(IMP_COLS)){const i=head.findIndex(h=>names.includes(h));if(i>=0)col[f]=i}
 const catMap=new Map(cats.map(c=>[impCatKey(c.name),c]));
 const byId=new Map(),bySku=new Map();(IMP.existing||[]).forEach(p=>{byId.set(p.id,p);if(p.sku)bySku.set(String(p.sku).toLowerCase(),p)});
 const seenSku=new Set();
 T.slice(1).forEach((raw,i)=>{
  const g=f=>col[f]==null?"":String(raw[col[f]]==null?"":raw[col[f]]).trim().replace(/^'(?=[=+\-@])/,"");
  const r={n:i+2,raw,errs:[],warns:[],body:{},action:"create",file:null,photoUrl:""};
  const name=g("name"),sku=g("sku"),idv=g("id");
  const ex=(idv&&/^\d+$/.test(idv)&&byId.get(+idv))||(sku&&bySku.get(sku.toLowerCase()))||null;
  if(ex){r.existingId=ex.id;r.action=IMP.mode==="update"?"update":"skip";if(r.action==="skip")r.warns.push("Already in your shop — skipped")}
  const upd=r.action==="update",b=r.body;
  r.name=name||(ex&&ex.name)||"";
  if(name){if(name.length<2||name.length>160)r.errs.push("Name must be 2–160 characters.");else b.name=name}else if(!ex)r.errs.push("Name is missing.");
  // category
  const cn=g("category");r.cat=cn;
  if(cn){const c=catMap.get(impCatKey(cn));if(c){b.categoryId=c.id}else if(IMP.mkCats){r.newCat=cn.slice(0,80)}else r.errs.push(`Category "${cn}" doesn't exist.`)}
  else if(!ex)r.errs.push("Category is missing.");
  // money + numbers
  // sizes: "6x6:1500:5; 5x6:1400:3"  (name:price[:stock[:cost]]) — each size has its own price and stock
  const sz=g("sizes");
  if(sz){r.sizes=[];const seenL=new Set();
   for(const part of sz.split(/\s*[;|]\s*/).filter(Boolean)){const f=part.split(":").map(x=>x.trim()),lab=f[0],pr=impMoney(f[1]),stk=f[2]===undefined||f[2]===""?(IMP.defStock):impMoney(f[2]),cs=f[3]===undefined||f[3]===""?null:impMoney(f[3]);
    if(!lab){r.errs.push(`A size in "${part}" has no name.`);continue}if(seenL.has(lab.toLowerCase())){r.errs.push(`The size "${lab}" is listed twice.`);continue}seenL.add(lab.toLowerCase());
    if(!(pr>=1)){r.errs.push(`Size "${lab}" needs a price (use ${lab}:1500:5).`);continue}
    if(stk==null||!Number.isInteger(stk)||stk<0){r.errs.push(`Stock for size "${lab}" isn't a whole number.`);continue}
    r.sizes.push({label:lab,price:pr,stock:stk,costPrice:cs==null||!(cs>=0)?undefined:cs})}
   if(!r.sizes.length&&!r.errs.length)r.errs.push("Sizes column is empty.");}
  const price=impMoney(g("price"));
  if(sz&&r.sizes&&r.sizes.length){b.price=Math.min(...r.sizes.map(x=>x.price));delete b.stock;if(price!=null)r.warns.push("Price column ignored — each size has its own price")}
  else if(price==null){if(!ex)r.errs.push("Price is missing.")}else if(!(price>=1&&price<=1e7))r.errs.push("Price must be 1 or more.");else b.price=price;
  if(r.sizes&&ex&&Number(ex.variant_count)>=0){delete b.compareAtPrice;delete b.price}
  const cl=g("colors");if(cl){b.colors=cl.split(/\s*[,;|]\s*/).filter(Boolean).join(", ");if(b.colors.length>255){r.errs.push("Colours are too long.");delete b.colors}}
  r.price=r.sizes&&r.sizes.length?Math.min(...r.sizes.map(x=>x.price)):(b.price!=null?b.price:(ex?Number(ex.price):null));
  const was=impMoney(g("compareAtPrice"));if(was!=null){if(!(was>=1))r.errs.push("'Was' price isn't valid.");else b.compareAtPrice=was}
  if(b.compareAtPrice!=null&&r.price!=null&&b.compareAtPrice<r.price)r.errs.push("'Was' price is lower than the price.");
  const cost=impMoney(g("costPrice"));if(cost!=null){if(!(cost>=0))r.errs.push("Cost price isn't valid.");else b.costPrice=cost}
  const st=impMoney(g("stock"));if(r.sizes&&r.sizes.length){}else if(st!=null){if(!Number.isInteger(st)||st<0)r.errs.push("Stock must be a whole number, 0 or more.");else b.stock=st}else if(!ex)b.stock=IMP.defStock;
  r.stock=r.sizes&&r.sizes.length?r.sizes.reduce((a,x)=>a+x.stock,0):(b.stock!=null?b.stock:(ex?ex.stock:0));
  const low=impMoney(g("lowStockThreshold"));if(low!=null){if(!Number.isInteger(low)||low<0)r.errs.push("Low-stock alert must be a whole number.");else b.lowStockThreshold=low}
  // text
  if(sku){if(!/^[A-Za-z0-9._\- ]{1,40}$/.test(sku))r.errs.push("SKU can only use letters, numbers, spaces and . _ -");else{b.sku=sku;const k=sku.toLowerCase();if(seenSku.has(k))r.errs.push("This SKU appears twice in your file.");seenSku.add(k)}}
  const brand=g("brand");if(brand){if(brand.length>80)r.errs.push("Brand is too long (max 80).");else b.brand=brand}
  const desc=g("description");if(desc){if(desc.length>2000)r.errs.push(`Description is too long (${desc.length}/2000).`);else b.description=desc}
  const tags=g("tags");if(tags){if(tags.length>255)r.errs.push("Tags are too long (max 255).");else b.tags=tags}
  const eta=g("etaLabel");if(eta){if(eta.length>40)r.errs.push("Delivery estimate is too long (max 40).");else b.etaLabel=eta}
  for(const f of["active","featured"]){const v=impBool(g(f));if(v===null)r.errs.push(`"${f==="active"?"Visible":"Featured"}" should be yes or no.`);else if(v!==undefined)b[f]=v}
  // photo: a link, or the name of a photo you selected (falls back to a photo named after the SKU)
  // photos: one or several, separated by "|". Each is a link or a selected file's name, optionally tagged with a colour: "pink.jpg @ Pink | blue.jpg @ Blue"
  const im=g("image");r.photos=[];

 else if(r==="lastmonth"){const t=ymd(now),first=new Date(t.slice(0,8)+"01T00:00:00Z"),end=new Date(first.getTime()-86400000);rep.to=ymd(new Date(end.getTime()-3*3600000));rep.from=rep.to.slice(0,8)+"01"}

 const prodOpts=await productOptions(x.link_type==="product"?x.link_id:0);
 modal(`<h3>${id?"Edit banner":"New banner"}</h3>
 <div class="fld"><label for="bnT">Headline</label><input id="bnT" name="title" maxlength="80" required placeholder="Weekend sale — 10% off" value="${esc(x.title)}"></div>
 <div class="fld"><label for="bnS">Small text (optional)</label><input id="bnS" name="subtitle" maxlength="160" value="${esc(x.subtitle||"")}"></div>
 <div class="fld"><label for="bnI">Picture link (optional)</label><div style="display:flex;gap:8px"><input id="bnI" name="imageUrl" maxlength="500" placeholder="https://…" value="${esc(x.image_url||"")}" style="flex:1"><label class="btn sec sm" for="bnF">Upload</label><input id="bnF" type="file" accept="image/*" hidden></div><span class="hint" id="bnM">A wide picture works best. Without one, the banner uses a colour.</span></div>
 <div class="fld"><label for="bnL">When tapped, open</label><select id="bnL" name="linkType"><option value="none" ${x.link_type==="none"?"selected":""}>Nothing</option><option value="category" ${x.link_type==="category"?"selected":""}>A category</option><option value="product" ${x.link_type==="product"?"selected":""}>A product</option></select></div>
 <div class="fld" id="bnCW" ${x.link_type==="category"?"":"hidden"}><label for="bnC">Category</label><select id="bnC" name="catId">${cats.map(k=>`<option value="${k.id}" ${+x.link_id===k.id&&x.link_type==="category"?"selected":""}>${esc(k.icon)} ${esc(k.name)}</option>`).join("")}</select></div>
 <div class="fld" id="bnPW" ${x.link_type==="product"?"":"hidden"}><label for="bnP">Product</label><select id="bnP" name="prodId">${prodOpts}</select></div>
 <div class="frow"><div class="fld"><label for="bnA">Shows from (optional)</label><input id="bnA" name="startsAt" type="datetime-local" value="${esc(toLocalInput(x.starts_at))}"></div><div class="fld"><label for="bnB">Until (optional)</label><input id="bnB" name="endsAt" type="datetime-local" value="${esc(toLocalInput(x.ends_at))}"></div></div>
 <div class="fld" style="max-width:160px"><label for="bnO">Order</label><input id="bnO" name="sortOrder" type="number" step="1" value="${esc(x.sort_order||0)}"><span class="hint">Lower shows first.</span></div>
 <label class="tog"><span>Active</span><span class="switch"><input type="checkbox" name="active" ${x.active?"checked":""}><span></span></span></label>
 <div class="err" aria-live="polite"></div>
 <div class="mact"><button type="button" class="btn sec" data-act="closeModal">Cancel</button><button class="btn" type="submit">${id?"Save changes":"Create banner"}</button></div>`,
 async f=>{const e=f.elements;
  const body={title:e.title.value.trim(),subtitle:e.subtitle.value.trim(),imageUrl:e.imageUrl.value.trim(),linkType:e.linkType.value,startsAt:fromLocalInput(e.startsAt.value),endsAt:fromLocalInput(e.endsAt.value),active:e.active.checked,sortOrder:Number(e.sortOrder.value)||0};
  body.linkId=body.linkType==="category"?Number(e.catId.value):body.linkType==="product"?Number(e.prodId.value):null;
  if(body.title.length<2)throw new Error("Give the banner a headline.");
  await api(id?"/banners/"+id:"/banners",send(id?"PATCH":"POST",body));closeModal();toast(id?"Banner updated":"Banner created");vPromotions()});
 const lt=document.getElementById("bnL");lt.onchange=()=>{document.getElementById("bnCW").hidden=lt.value!=="category";document.getElementById("bnPW").hidden=lt.value!=="product"};
 document.getElementById("bnF").onchange=async ev=>{const file=ev.target.files[0];if(!file)return;const m=document.getElementById("bnM");m.textContent="Uploading…";
  try{const d=await api("/uploads",{method:"POST",body:file,headers:{"Content-Type":file.type||"image/jpeg"}});document.getElementById("bnI").value=d.url;m.textContent="Uploaded."}catch(err){m.textContent="Upload failed: "+err.message}}}
async function delBanner(id,name){if(!(await confirmBox("Delete banner?",`"${name}" disappears from the shop.`,"Delete")))return;
 try{await api("/banners/"+id,{method:"DELETE"});toast("Banner deleted");vPromotions()}catch(e){toast(e.message);handleErr(e)}}

/* ---------- boot ---------- */
loadCreds();
$("apiBase").value=API||DEFAULT_API;
if(API&&KEY){$("adminKey").value=KEY;start()}
</script>
</body>
</html>

name: Deploy storefront + admin to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "admin/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The shop is the root of the site; the admin panel is nested at /admin/.
      # Both are plain static HTML, so this is just a file copy — no build step.
      - name: Assemble site
        run: |
          mkdir -p site/admin
          cp frontend/index.html site/index.html
          cp admin/index.html site/admin/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
